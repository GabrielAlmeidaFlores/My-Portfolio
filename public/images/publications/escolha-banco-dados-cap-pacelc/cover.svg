<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="CAP e PACELC">
  <defs>
    <linearGradient id="cap-cover-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#04101f"/>
    </linearGradient>
    <linearGradient id="cap-cover-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="cap-cover-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#cap-cover-bg)"/>
  <rect width="1200" height="630" fill="url(#cap-cover-grid)"/>
  <circle cx="210" cy="170" r="150" fill="#38bdf8" opacity="0.1"/>
  <circle cx="990" cy="470" r="170" fill="#818cf8" opacity="0.12"/>

  <g transform="translate(150 165)">
    <polygon
      points="180,20 320,100 320,260 180,340 40,260 40,100"
      fill="#0f172a"
      stroke="#38bdf8"
      stroke-width="3"
    />
    <text
      x="180"
      y="145"
      text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="48"
      font-weight="700"
      fill="#67e8f9"
    >C</text>
    <text
      x="105"
      y="235"
      text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="48"
      font-weight="700"
      fill="#a5b4fc"
    >A</text>
    <text
      x="255"
      y="235"
      text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="48"
      font-weight="700"
      fill="#c4b5fd"
    >P</text>
  </g>

  <text
    x="330"
    y="545"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, sans-serif"
    font-size="18"
    letter-spacing="0.28em"
    fill="#94a3b8"
  >CAP</text>

  <path
    d="M500 315 H700"
    stroke="url(#cap-cover-accent)"
    stroke-width="4"
    stroke-linecap="round"
  />
  <polygon points="700,315 672,301 672,329" fill="#a5b4fc"/>

  <g transform="translate(740 185)">
    <rect
      x="0"
      y="0"
      width="320"
      height="260"
      rx="24"
      fill="#0f172a"
      stroke="#818cf8"
      stroke-width="3"
    />
    <text
      x="160"
      y="72"
      text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="40"
      font-weight="700"
      fill="#c4b5fd"
    >PACELC</text>
    <text
      x="160"
      y="125"
      text-anchor="middle"
      font-family="ui-sans-serif, system-ui, sans-serif"
      font-size="18"
      fill="#cbd5e1"
    >Partition: A or C</text>
    <text
      x="160"
      y="162"
      text-anchor="middle"
      font-family="ui-sans-serif, system-ui, sans-serif"
      font-size="18"
      fill="#cbd5e1"
