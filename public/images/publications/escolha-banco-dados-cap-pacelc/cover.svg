<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="CAP e PACELC">
  <defs>
    <linearGradient id="db-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0c1228"/>
      <stop offset="100%" stop-color="#12081f"/>
    </linearGradient>
    <linearGradient id="db-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="db-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="db-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="db-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="db-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="db-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="db-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.42"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#db-bg)"/>
  <rect width="1200" height="630" fill="url(#db-grid)"/>
  <circle cx="360" cy="300" r="220" fill="#38bdf8" opacity="0.06" filter="url(#db-soft)"/>
  <circle cx="980" cy="180" r="140" fill="#a855f7" opacity="0.1" filter="url(#db-soft)"/>

  <g transform="translate(120 90)">
    <circle cx="280" cy="250" r="188" fill="none" stroke="url(#db-ring)" stroke-width="2" opacity="0.35" stroke-dasharray="10 14"/>
    <circle cx="280" cy="250" r="118" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.7"/>

    <g filter="url(#db-glow)">
      <line x1="280" y1="110" x2="160" y2="340" stroke="#475569" stroke-width="2"/>
      <line x1="280" y1="110" x2="400" y2="340" stroke="#475569" stroke-width="2"/>
      <line x1="160" y1="340" x2="400" y2="340" stroke="#475569" stroke-width="2"/>
    </g>

    <g transform="translate(230 50)">
      <circle cx="50" cy="50" r="50" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="50" cy="50" r="50" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.35" filter="url(#db-glow)"/>
      <text x="50" y="62" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="42" font-weight="700" fill="url(#db-cyan)">C</text>
    </g>
    <text x="280" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="0.28em" fill="#94a3b8">CONSISTENCY</text>

    <g transform="translate(90 290)">
      <circle cx="50" cy="50" r="50" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
      <circle cx="50" cy="50" r="50" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.35" filter="url(#db-glow)"/>
      <text x="50" y="62" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="42" font-weight="700" fill="url(#db-indigo)">A</text>
    </g>
    <text x="140" y="430" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="0.28em" fill="#94a3b8">AVAILABILITY</text>

    <g transform="translate(330 290)">
      <circle cx="50" cy="50" r="50" fill="#0f172a" stroke="#c084fc" stroke-width="2.5"/>
      <circle cx="50" cy="50" r="50" fill="none" stroke="#e879f9" stroke-width="1" opacity="0.35" filter="url(#db-glow)"/>
      <text x="50" y="62" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="42" font-weight="700" fill="url(#db-violet)">P</text>
    </g>
    <text x="420" y="430" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="0.28em" fill="#94a3b8">PARTITION</text>

    <g transform="translate(230 200)">
      <circle cx="50" cy="50" r="36" fill="#0b1224" stroke="#67e8f9" stroke-width="2" filter="url(#db-glow)"/>
      <ellipse cx="50" cy="42" rx="16" ry="7" fill="none" stroke="#67e8f9" stroke-width="2.5"/>
      <path d="M34 42 V58 C34 62 41 66 50 66 C59 66 66 62 66 58 V42" fill="none" stroke="#67e8f9" stroke-width="2.5"/>
    </g>
  </g>

  <g transform="translate(720 130)">
    <rect x="0" y="0" width="400" height="370" rx="28" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="370" rx="28" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.3" filter="url(#db-glow)"/>

    <text x="40" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="0.35em" fill="#94a3b8">CHOOSE WITH</text>
    <text x="40" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="52" font-weight="700" letter-spacing="0.06em" fill="url(#db-indigo)" filter="url(#db-glow)">PACELC</text>

    <line x1="40" y1="150" x2="360" y2="150" stroke="#1e293b" stroke-width="1"/>

    <text x="40" y="200" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#64748b">IF</text>
    <text x="80" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#e2e8f0">Partition</text>
    <text x="40" y="242" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#67e8f9">A</text>
    <text x="68" y="242" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#94a3b8">or</text>
    <text x="104" y="242" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#c4b5fd">C</text>

    <text x="40" y="300" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#64748b">ELSE</text>
    <text x="100" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#e2e8f0">Latency</text>
    <text x="40" y="342" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#e879f9">L</text>
    <text x="68" y="342" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#94a3b8">or</text>
    <text x="104" y="342" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#38bdf8">C</text>
  </g>

  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#334155" stroke-width="1" opacity="0.55"/>
</svg>
