    <line
      x1="56"
      y1="190"
      x2="264"
      y2="190"
      stroke="#334155"
      stroke-width="1"
    />
    <text
      x="160"
      y="228"
      text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="15"
      letter-spacing="0.18em"
      fill="#67e8f9"
    >TRADEOFF MAP</text>
  </g>
