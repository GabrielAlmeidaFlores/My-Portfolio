  <g>
    <rect x="1112" y="92" width="368" height="92" rx="16" fill="#0F172A" fill-opacity="0.86" stroke="#334155"/>
    <text x="1136" y="118" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.1">EDGE PROVENANCE</text>
    <path d="M1138 144H1180" stroke="#22D3EE" stroke-width="2.4" stroke-linecap="round"/>
    <text x="1194" y="148" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500">EXTRACTED</text>
    <path d="M1138 168H1180" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/>
    <text x="1194" y="172" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500">INFERRED</text>
