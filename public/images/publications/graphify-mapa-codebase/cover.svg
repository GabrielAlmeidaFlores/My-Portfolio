<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="1480" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="0.5" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0" cy="0" r="1" gradientTransform="translate(800 380) scale(900 620)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerFill" cx="0" cy="0" r="1" gradientTransform="translate(800 340) rotate(90) scale(96)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="0.65" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="centerRing" x1="710" y1="250" x2="890" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="edgeCyan" x1="800" y1="340" x2="520" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="edgeViolet" x1="800" y1="340" x2="1120" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="edgeGreen" x1="800" y1="340" x2="1180" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="edgeAmber" x1="800" y1="340" x2="390" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="edgePink" x1="800" y1="340" x2="1160" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F472B6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="softGlow" x="250" y="30" width="1100" height="700" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" stroke="#64748B" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <mask id="gridFade">
      <radialGradient id="gridMaskGradient" cx="0" cy="0" r="1" gradientTransform="translate(800 360) scale(760 520)" gradientUnits="userSpaceOnUse">
        <stop stop-color="white" stop-opacity="0.9"/>
        <stop offset="0.7" stop-color="white" stop-opacity="0.35"/>
        <stop offset="1" stop-color="black" stop-opacity="0"/>
      </radialGradient>
      <rect width="1600" height="900" fill="url(#gridMaskGradient)"/>
    </mask>
  </defs>

  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="40" fill="url(#vignette)"/>
  <rect width="1600" height="900" rx="40" fill="url(#grid)" mask="url(#gridFade)"/>

  <g filter="url(#softGlow)">
