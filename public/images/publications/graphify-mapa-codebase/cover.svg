    <ellipse cx="1040" cy="420" rx="260" ry="170" fill="#8B5CF6" fill-opacity="0.16"/>
    <ellipse cx="520" cy="430" rx="240" ry="150" fill="#34D399" fill-opacity="0.08"/>
  </g>

  <g stroke-linecap="round" fill="none">
    <path d="M800 340C712 300 620 246 494 214" stroke="url(#edgeViolet)" stroke-width="2.6"/>
    <path d="M800 340C810 268 812 208 810 142" stroke="url(#edgeCyan)" stroke-width="2.6"/>
    <path d="M800 340C890 300 1000 268 1118 250" stroke="url(#edgeGreen)" stroke-width="2.6"/>
    <path d="M800 340C700 356 560 392 402 442" stroke="url(#edgeAmber)" stroke-width="2.6"/>
    <path d="M800 340C916 362 1072 406 1198 446" stroke="url(#edgePink)" stroke-width="2.6"/>
    <path d="M800 340C740 412 642 486 560 540" stroke="url(#edgeCyan)" stroke-width="2.4"/>
    <path d="M800 340C870 416 968 486 1050 540" stroke="url(#edgeViolet)" stroke-width="2.4"/>
    <path d="M800 340C802 424 806 510 808 592" stroke="url(#edgeGreen)" stroke-width="2.4"/>

    <path d="M494 214C470 300 430 380 402 442" stroke="#A78BFA" stroke-opacity="0.28" stroke-width="1.8" stroke-dasharray="7 10"/>
    <path d="M1118 250C1150 320 1176 386 1198 446" stroke="#34D399" stroke-opacity="0.26" stroke-width="1.8" stroke-dasharray="7 10"/>
    <path d="M560 540C660 570 742 590 808 592" stroke="#22D3EE" stroke-opacity="0.26" stroke-width="1.8" stroke-dasharray="7 10"/>
    <path d="M1050 540C990 570 900 590 808 592" stroke="#F472B6" stroke-opacity="0.24" stroke-width="1.8" stroke-dasharray="7 10"/>
    <path d="M810 142C960 132 1060 178 1118 250" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1.6" stroke-dasharray="6 10"/>
    <path d="M402 442C450 490 500 520 560 540" stroke="#FBBF24" stroke-opacity="0.24" stroke-width="1.6" stroke-dasharray="6 10"/>
  </g>

  <g filter="url(#nodeGlow)">
    <circle cx="494" cy="214" r="7" fill="#A78BFA"/>
    <circle cx="810" cy="142" r="7" fill="#22D3EE"/>
    <circle cx="1118" cy="250" r="7" fill="#34D399"/>
    <circle cx="402" cy="442" r="7" fill="#FBBF24"/>
    <circle cx="1198" cy="446" r="7" fill="#F472B6"/>
    <circle cx="560" cy="540" r="7" fill="#22D3EE"/>
    <circle cx="1050" cy="540" r="7" fill="#A78BFA"/>
    <circle cx="808" cy="592" r="7" fill="#34D399"/>
  </g>

  <g>
    <circle cx="494" cy="214" r="34" fill="#0B1220" stroke="#A78BFA" stroke-width="2.2"/>
    <circle cx="494" cy="214" r="34" fill="#A78BFA" fill-opacity="0.08"/>
    <text x="494" y="220" text-anchor="middle" fill="#DDD6FE" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">code</text>

    <circle cx="810" cy="142" r="34" fill="#0B1220" stroke="#22D3EE" stroke-width="2.2"/>
    <circle cx="810" cy="142" r="34" fill="#22D3EE" fill-opacity="0.08"/>
    <text x="810" y="148" text-anchor="middle" fill="#A5F3FC" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">api</text>

    <circle cx="1118" cy="250" r="34" fill="#0B1220" stroke="#34D399" stroke-width="2.2"/>
    <circle cx="1118" cy="250" r="34" fill="#34D399" fill-opacity="0.08"/>
    <text x="1118" y="256" text-anchor="middle" fill="#A7F3D0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">docs</text>

    <circle cx="402" cy="442" r="34" fill="#0B1220" stroke="#FBBF24" stroke-width="2.2"/>
    <circle cx="402" cy="442" r="34" fill="#FBBF24" fill-opacity="0.08"/>
    <text x="402" y="448" text-anchor="middle" fill="#FDE68A" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">sql</text>

    <circle cx="1198" cy="446" r="34" fill="#0B1220" stroke="#F472B6" stroke-width="2.2"/>
    <circle cx="1198" cy="446" r="34" fill="#F472B6" fill-opacity="0.08"/>
    <text x="1198" y="452" text-anchor="middle" fill="#FBCFE8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">tests</text>

    <circle cx="560" cy="540" r="34" fill="#0B1220" stroke="#22D3EE" stroke-width="2.2"/>
    <circle cx="560" cy="540" r="34" fill="#22D3EE" fill-opacity="0.08"/>
    <text x="560" y="546" text-anchor="middle" fill="#A5F3FC" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">auth</text>

    <circle cx="1050" cy="540" r="34" fill="#0B1220" stroke="#A78BFA" stroke-width="2.2"/>
    <circle cx="1050" cy="540" r="34" fill="#A78BFA" fill-opacity="0.08"/>
    <text x="1050" y="546" text-anchor="middle" fill="#DDD6FE" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">billing</text>

