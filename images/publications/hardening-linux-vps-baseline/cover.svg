<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Linux VPS hardening baseline">
  <defs>
    <linearGradient id="linux-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#071a14"/>
      <stop offset="100%" stop-color="#04101f"/>
    </linearGradient>
    <linearGradient id="linux-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="linux-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="linux-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="linux-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="linux-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="linux-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#linux-bg)"/>
  <rect width="1200" height="630" fill="url(#linux-grid)"/>
  <circle cx="160" cy="480" r="200" fill="#34d399" opacity="0.1" filter="url(#linux-soft)"/>
  <circle cx="980" cy="140" r="160" fill="#22d3ee" opacity="0.08" filter="url(#linux-soft)"/>

  <text x="88" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="0.42em" fill="#94a3b8">VPS DAY-1</text>
  <text x="88" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="72" font-weight="700" letter-spacing="0.04em" fill="url(#linux-green)" filter="url(#linux-glow)">HARDENING</text>
  <text x="88" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="42" font-weight="600" letter-spacing="0.18em" fill="#e2e8f0">LINUX</text>
  <text x="88" y="340" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#94a3b8">SSH · firewall · sysctl · baseline seguro</text>

  <g transform="translate(88 390)">
    <rect x="0" y="0" width="112" height="40" rx="20" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="5" fill="#34d399" filter="url(#linux-glow)"/>
    <text x="40" y="26" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#6ee7b7">SSH</text>

    <rect x="128" y="0" width="148" height="40" rx="20" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="150" cy="20" r="5" fill="#22d3ee" filter="url(#linux-glow)"/>
    <text x="168" y="26" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#67e8f9">FIREWALL</text>

    <rect x="292" y="0" width="132" height="40" rx="20" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="314" cy="20" r="5" fill="#94a3b8"/>
    <text x="332" y="26" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#cbd5e1">SYSCTL</text>
  </g>

  <g transform="translate(620 110)">
    <rect x="0" y="0" width="500" height="410" rx="28" fill="url(#linux-panel)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="500" height="410" rx="28" fill="none" stroke="#34d399" stroke-width="1" opacity="0.25" filter="url(#linux-glow)"/>

    <rect x="0" y="0" width="500" height="52" rx="28" fill="#111827"/>
    <rect x="0" y="28" width="500" height="24" fill="#111827"/>
    <circle cx="28" cy="26" r="7" fill="#f87171"/>
    <circle cx="52" cy="26" r="7" fill="#fbbf24"/>
    <circle cx="76" cy="26" r="7" fill="#34d399"/>
    <text x="250" y="32" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="0.2em" fill="#64748b">root@vps:~</text>

    <text x="36" y="100" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#64748b">$</text>
    <text x="58" y="100" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#e2e8f0">sshd_config</text>
    <text x="36" y="148" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#6ee7b7">PermitRootLogin no</text>
    <text x="36" y="186" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#6ee7b7">PasswordAuthentication no</text>
    <text x="36" y="224" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#67e8f9">AllowUsers deploy</text>

    <line x1="36" y1="258" x2="464" y2="258" stroke="#1e293b" stroke-width="1"/>

    <text x="36" y="300" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#64748b">$</text>
    <text x="58" y="300" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#e2e8f0">ufw status</text>
    <text x="36" y="348" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#34d399">Status: active</text>
    <text x="36" y="386" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#94a3b8">Default: deny (incoming)</text>
  </g>

  <g transform="translate(980 470)" filter="url(#linux-glow)">
    <path d="M40 8 L72 22 V52 C72 74 58 90 40 98 C22 90 8 74 8 52 V22 Z" fill="#0f172a" stroke="#67e8f9" stroke-width="3"/>
    <path d="M28 52 L36 60 L54 40" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#334155" stroke-width="1" opacity="0.55"/>
</svg>
